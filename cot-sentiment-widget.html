<style>
:root {
  --bg: #0f1118; --surface: #181b25; --surface-raised: #1f2330;
  --border: #2a2e3d; --fg: #e2e4ec; --fg-muted: #8b8fa3;

  --font-body: 'DM Sans', system-ui, sans-serif;
  --font-mono: 'JetBrains Mono', ui-monospace, monospace;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {

    --accent: #3570de; --accent-dim: rgba(53,112,222,0.10);
    --bullish: #1a9e74; --bullish-dim: rgba(26,158,116,0.10);
    --bearish: #d14343; --bearish-dim: rgba(209,67,67,0.10);
    --neutral: #c9960a; --neutral-dim: rgba(201,150,10,0.10);
    color-scheme: light;
  }
}
:root[data-theme="light"] {
  --bg: #f5f6f8; --surface: #ffffff; --surface-raised: #f0f1f5;
  --border: #dce0ea; --fg: #1a1d2b; --fg-muted: #6b7085;

  --bearish: #d14343; --bearish-dim: rgba(209,67,67,0.10);
  --neutral: #c9960a; --neutral-dim: rgba(201,150,10,0.10);
  color-scheme: light;
}
* { margin: 0; box-sizing: border-box; }
body {
  background: var(--bg); color: var(--fg); font-family: var(--font-body);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0; min-height: 100vh;
}
.header {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 10;
  background: var(--bg); border-bottom: 1px solid var(--border);
  padding: 16px 0 12px; display: flex; flex-wrap: wrap;
  align-items: center; gap: 8px 16px;
}
.header h1 { font-size: 1.15rem; font-weight: 700; letter-spacing: -0.01em; white-space: nowrap; }
.header h1 span { color: var(--accent); }
.header-meta { font-family: var(--font-mono); font-size: 0.72rem; color: var(--fg-muted); margin-left: auto; }
.status-bar { display: flex; flex-wrap: wrap; gap: 6px; padding: 10px 0; align-items: center; }
.status-pill { font-size: 0.7rem; font-weight: 600; padding: 3px 10px; border-radius: 999px; letter-spacing: 0.03em; text-transform: uppercase; }
.pill-live { background: var(--bullish-dim); color: var(--bullish); }
.pill-offline { background: var(--bearish-dim); color: var(--bearish); }
.pill-source { background: var(--accent-dim); color: var(--accent); }
.pill-loading { background: var(--neutral-dim); color: var(--neutral); animation: pulse 1.5s infinite; }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.5} }
.btn-refresh {
  background: var(--accent-dim); color: var(--accent); border: 1px solid var(--accent);
  border-radius: 6px; padding: 4px 12px; font-size: 0.7rem; font-weight: 600;
  font-family: var(--font-body); cursor: pointer; letter-spacing: 0.03em;
  text-transform: uppercase; margin-left: 8px; transition: background 0.2s;
}
.btn-refresh:hover { background: var(--accent); color: var(--bg); }
.btn-refresh:disabled { opacity: 0.4; cursor: not-allowed; }
.deck { max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; gap: 10px; padding-bottom: 8px; }
.market-tabs { display: flex; gap: 6px; overflow-x: auto; padding: 2px 0 4px; scrollbar-width: none; scroll-behavior: smooth; }
.market-tabs::-webkit-scrollbar { display: none; }
.tab { flex: 0 0 auto; display: flex; align-items: center; gap: 6px; background: var(--surface); color: var(--fg-muted); border: 1px solid var(--border); border-radius: 999px; padding: 5px 11px; font: 600 0.72rem var(--font-body); cursor: pointer; white-space: nowrap; }
.tab .dot { width: 7px; height: 7px; border-radius: 50%; }
.tab[aria-selected="true"] { color: var(--fg); border-color: var(--accent); background: var(--accent-dim); }
.tab:focus-visible, .nav-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.slider { display: flex; gap: 16px; overflow-x: auto; scroll-snap-type: x mandatory; scroll-behavior: smooth; overscroll-behavior-x: contain; scrollbar-width: none; }
.slider::-webkit-scrollbar { display: none; }
.slider > .card { flex: 0 0 100%; min-width: 0; scroll-snap-align: center; scroll-snap-stop: always; }
.slider-nav { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.nav-btn { background: var(--surface); color: var(--fg); border: 1px solid var(--border); border-radius: 8px; padding: 8px 14px; font: 600 0.78rem var(--font-body); cursor: pointer; min-width: 84px; }
.nav-btn:disabled { opacity: 0.35; cursor: default; }
.slide-count { font-family: var(--font-mono); font-size: 0.72rem; color: var(--fg-muted); text-align: center; font-variant-numeric: tabular-nums; }
@media (prefers-reduced-motion: reduce) { .slider, .market-tabs { scroll-behavior: auto; } }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 16px; display: flex; flex-direction: column; gap: 12px; transition: border-color 0.2s; }
.card:hover { border-color: var(--accent); }
.card-head { display: flex; align-items: center; gap: 10px; }
.card-icon { width: 36px; height: 36px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 1.1rem; flex-shrink: 0; }
.card-title { font-size: 0.95rem; font-weight: 700; }
.card-ticker { font-family: var(--font-mono); font-size: 0.68rem; color: var(--fg-muted); }
.card-verdict { margin-left: auto; font-size: 0.68rem; font-weight: 700; padding: 3px 10px; border-radius: 6px; letter-spacing: 0.04em; text-transform: uppercase; white-space: nowrap; }
.v-bullish { background: var(--bullish-dim); color: var(--bullish); }
.v-lean-bullish { background: var(--bullish-dim); color: var(--bullish); opacity: 0.8; }
.v-neutral { background: var(--neutral-dim); color: var(--neutral); }
.v-lean-bearish { background: var(--bearish-dim); color: var(--bearish); opacity: 0.8; }
.v-bearish { background: var(--bearish-dim); color: var(--bearish); }
.card-price { display: flex; align-items: baseline; gap: 6px; }
.price-val { font-family: var(--font-mono); font-size: 1.5rem; font-weight: 600; font-variant-numeric: tabular-nums; }
.range-bar-wrap { display: flex; flex-direction: column; gap: 4px; }
.range-labels { display: flex; justify-content: space-between; font-family: var(--font-mono); font-size: 0.65rem; color: var(--fg-muted); }
.range-bar { position: relative; height: 6px; background: var(--surface-raised); border-radius: 3px; overflow: visible; }
.range-fill { height: 100%; border-radius: 3px; transition: width 0.6s ease; }
.range-dot { position: absolute; top: 50%; width: 12px; height: 12px; border-radius: 50%; border: 2px solid var(--surface); transform: translate(-50%, -50%); transition: left 0.6s ease; }
.range-zone { text-align: center; font-size: 0.65rem; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; margin-top: 2px; }
.metrics { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
.metric { background: var(--surface-raised); border-radius: 6px; padding: 8px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.metric-label { font-size: 0.6rem; color: var(--fg-muted); text-transform: uppercase; letter-spacing: 0.05em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.metric-val { font-family: var(--font-mono); font-size: 0.82rem; font-weight: 600; font-variant-numeric: tabular-nums; }
.metric-delta { font-family: var(--font-mono); font-size: 0.65rem; font-weight: 500; font-variant-numeric: tabular-nums; }
.up { color: var(--bullish); } .down { color: var(--bearish); }
.notes { display: flex; flex-direction: column; gap: 3px; padding-top: 4px; border-top: 1px solid var(--border); }
.note { font-size: 0.72rem; color: var(--fg-muted); line-height: 1.4; padding-left: 12px; position: relative; }
.note::before { content: ''; position: absolute; left: 0; top: 6px; width: 4px; height: 4px; border-radius: 50%; background: var(--fg-muted); }
.score-bar-wrap { display: flex; align-items: center; gap: 8px; }
.score-bar { flex: 1; height: 4px; background: var(--surface-raised); border-radius: 2px; position: relative; }
.score-bar-center { position: absolute; left: 50%; top: -2px; width: 1px; height: 8px; background: var(--fg-muted); opacity: 0.4; }
.score-bar-fill { position: absolute; top: 0; height: 100%; border-radius: 2px; transition: all 0.6s ease; }
.score-num { font-family: var(--font-mono); font-size: 0.78rem; font-weight: 700; min-width: 36px; text-align: right; font-variant-numeric: tabular-nums; }
.cot-date { font-family: var(--font-mono); font-size: 0.62rem; color: var(--fg-muted); text-align: right; padding-top: 2px; }
.footer { text-align: center; padding: 20px 0 28px; font-size: 0.68rem; color: var(--fg-muted); line-height: 1.6; }
.error-banner { background: var(--bearish-dim); color: var(--bearish); border: 1px solid var(--bearish); border-radius: 8px; padding: 10px 14px; font-size: 0.78rem; margin: 8px 0; line-height: 1.5; }
.error-banner.info { background: var(--accent-dim); color: var(--fg); border-color: var(--border); }
.pill-snapshot { background: var(--neutral-dim); color: var(--neutral); }
.src-tag { font-size: 0.6rem; font-weight: 600; letter-spacing: 0.05em; text-transform: uppercase; padding: 2px 7px; border-radius: 4px; margin-left: auto; }
.src-live { background: var(--bullish-dim); color: var(--bullish); }
.src-partial, .src-snapshot { background: var(--neutral-dim); color: var(--neutral); }
@media (max-width: 420px) { .metric { padding: 7px; } .metric-val { font-size: 0.76rem; } .header h1 { font-size: 1rem; } }
</style>

async function fetchJSON(url, ms) {
  var ctrl = new AbortController();
  var timer = setTimeout(function(){ ctrl.abort(); }, ms || 15000);
  try {
    var r = await fetch(url, { signal: ctrl.signal });
    if (!r.ok) throw new Error("HTTP " + r.status);
    return await r.json();
  } finally { clearTimeout(timer); }
}

async function fetchCOT(code, type) {
  var ds = CFTC_DATASETS[type];
  var params = new URLSearchParams({
    "$select": "report_date_as_yyyy_mm_dd," + ds.long + "," + ds.short + "," + ds.levLong + "," + ds.levShort + ",open_interest_all",
    "$where": "cftc_contract_market_code='" + code + "'",
    "$order": "report_date_as_yyyy_mm_dd DESC",
    "$limit": "12"
  });
  var data = await fetchJSON(ds.url + "?" + params);
  if (!Array.isArray(data)) throw new Error((data && data.message) || "unexpected CFTC response");
  return data.map(function(row) {
    return [
      String(row.report_date_as_yyyy_mm_dd || "").slice(0, 10),
      (Number(row[ds.long]) || 0) - (Number(row[ds.short]) || 0),
      (Number(row[ds.levLong]) || 0) - (Number(row[ds.levShort]) || 0),
      Number(row.open_interest_all) || 0
    ];
  }).reverse();
}

function weeklyFromDaily(daily) {
  var rows = [];
  for (var end = daily.length; end > 0; end -= 7) {
    var wk = daily.slice(Math.max(0, end - 7), end);
    rows.unshift([Math.max.apply(null, wk.map(function(d){ return d[0]; })), Math.min.apply(null, wk.map(function(d){ return d[1]; })), wk[wk.length - 1][2]]);
  }
  return rows;
}

async function fetchCoinbase(product) {
  var candles = await fetchJSON("https://api.exchange.coinbase.com/products/" + product + "/candles?granularity=86400");
  if (!Array.isArray(candles) || !candles.length) throw new Error("no Coinbase data");
  var daily = candles.slice(0, 140).reverse().map(function(c){ return [c[2], c[1], c[4]]; });
  return weeklyFromDaily(daily);
}

async function fetchYahoo(ticker) {
  var lastErr;
  for (var h = 0; h < YAHOO_HOSTS.length; h++) {
    try { return parseYahoo(await fetchJSON(YAHOO_HOSTS[h] + encodeURIComponent(ticker) + "?interval=1wk&range=6mo")); }
    catch (e) { lastErr = e; }
  }
  throw lastErr;
}

async function fetchPrice(ticker) {
  if (ticker === "BTC-USD") {
    try { return await fetchCoinbase("BTC-USD"); } catch (e) { return await fetchYahoo(ticker); }
  }
  return await fetchYahoo(ticker);
}

function parseYahoo(data) {
  var result = data && data.chart && data.chart.result && data.chart.result[0];
  if (!result || !result.timestamp) throw new Error("no price data");
  var q = result.indicators.quote[0], rows = [];
  for (var i = 0; i < result.timestamp.length; i++) {
    if (q.high[i] != null && q.low[i] != null && q.close[i] != null) rows.push([q.high[i], q.low[i], q.close[i]]);
  }
  return rows;
}

function premiumDiscount(rows) {
  var w = rows.slice(-20);
  var high = Math.max.apply(null, w.map(function(r){ return r[0]; }));
  var low = Math.min.apply(null, w.map(function(r){ return r[1]; }));
  var price = rows[rows.length - 1][2];
  var rng = high - low;
  if (rng === 0) return { price: price, pos: 50, zone: "PREMIUM", hi: high, lo: low };
  var pos = Math.max(0, Math.min(100, ((price - low) / rng) * 100));
  return { price: price, pos: Math.round(pos), zone: pos > 50 ? "PREMIUM" : "DISCOUNT", hi: high, lo: low };
}

function scoreMarket(cotRows, pd) {
  var cot = cotRows.map(function(r){ return { date: r[0], asset_mgr: r[1], leveraged: r[2], oi: r[3] }; });
  var cur = cot[cot.length - 1], prev = cot[cot.length - 2];
  var fourAgo = cot.length >= 5 ? cot[cot.length - 5] : cot[0];
  var dAsset = cur.asset_mgr - prev.asset_mgr;
  var dLev = cur.leveraged - prev.leveraged;
  var dOi = cur.oi - prev.oi;
  var tAsset = cur.asset_mgr - fourAgo.asset_mgr;
  var score = 0, notes = [];

  if (pd.zone === "DISCOUNT") { score += tAsset >= 0 ? 35 : 20; notes.push("Price in Discount — value zone"); }
  else { score -= tAsset <= 0 ? 35 : 20; notes.push("Price in Premium — expensive zone"); }

  var sign = tAsset > 0 ? "+" : "";
  if (tAsset > 0) { score += pd.zone === "DISCOUNT" ? 30 : 12; notes.push("Institutions adding longs (" + sign + tAsset.toLocaleString() + " /4wk)"); }
  else { score -= pd.zone === "PREMIUM" ? 30 : 12; notes.push("Institutions cutting longs (" + sign + tAsset.toLocaleString() + " /4wk)"); }

  var levMean = cot.reduce(function(s, r){ return s + Math.abs(r.leveraged); }, 0) / cot.length;
  var levExtreme = Math.abs(cur.leveraged) > 1.2 * levMean;
  if (dLev > 0 && !levExtreme) { score += 20; notes.push("Fast money adding longs (+" + dLev.toLocaleString() + ")"); }
  else if (dLev < 0 && !levExtreme) { score -= 20; notes.push("Fast money adding shorts (" + dLev.toLocaleString() + ")"); }
  else if (dLev > 0 && levExtreme) { score -= 10; notes.push("⚠ Fast-money longs at extreme — unwind risk"); }
  else if (dLev < 0 && levExtreme) { score += 10; notes.push("⚠ Fast-money shorts at extreme — squeeze fuel"); }

  if (dOi > 0 && tAsset > 0) { score += 15; notes.push("OI rising with institutional buying — new longs"); }
  else if (dOi > 0 && tAsset < 0) { score -= 15; notes.push("OI rising with institutions selling — new shorts"); }
  else { notes.push("OI flat/falling — positioning unwinding"); }

  score = Math.max(-100, Math.min(100, score));
  var verdict, verdictClass;
  if (score >= 40) { verdict = "BULLISH"; verdictClass = "v-bullish"; }
  else if (score >= 15) { verdict = "LEAN BULLISH"; verdictClass = "v-lean-bullish"; }
  else if (score > -15) { verdict = "NEUTRAL"; verdictClass = "v-neutral"; }
  else if (score > -40) { verdict = "LEAN BEARISH"; verdictClass = "v-lean-bearish"; }
  else { verdict = "BEARISH"; verdictClass = "v-bearish"; }

  return { assetMgr: cur.asset_mgr, dAsset: dAsset, leveraged: cur.leveraged, dLev: dLev, oi: cur.oi, dOi: dOi, score: score, verdict: verdict, verdictClass: verdictClass, notes: notes, cotDate: cur.date };
}

function fmt(n, dec) { return n.toLocaleString(undefined, { minimumFractionDigits: dec, maximumFractionDigits: dec }); }
function fmtDelta(n) { return { text: (n >= 0 ? "+" : "") + n.toLocaleString(), cls: n >= 0 ? "up" : "down" }; }

      '<div class="metric"><div class="metric-label">' + instLabel + '</div><div class="metric-val">' + d.assetMgr.toLocaleString() + '</div><div class="metric-delta ' + da.cls + '">' + da.text + ' 1w</div></div>' +
      '<div class="metric"><div class="metric-label">' + levLabel + '</div><div class="metric-val">' + d.leveraged.toLocaleString() + '</div><div class="metric-delta ' + dl.cls + '">' + dl.text + ' 1w</div></div>' +
      '<div class="metric"><div class="metric-label">Open Interest</div><div class="metric-val">' + d.oi.toLocaleString() + '</div><div class="metric-delta ' + doi.cls + '">' + doi.text + ' 1w</div></div>' +

    '<div class="cot-date">COT report: ' + d.cotDate + '</div>';
  return card;
}

var slides = [], currentIdx = 0;

function verdictColor(d) { return d.score >= 15 ? "var(--bullish)" : d.score > -15 ? "var(--neutral)" : "var(--bearish)"; }

function renderAll(data) {
  var container = document.getElementById("dashboard");
  var tabs = document.getElementById("marketTabs");
  var keepTicker = slides[currentIdx] && slides[currentIdx].ticker;
  container.innerHTML = "";
  tabs.innerHTML = "";
  slides = data;
  data.forEach(function(d, i) {
    container.appendChild(renderCard(d));
    var tab = document.createElement("button");
    tab.type = "button";
    tab.className = "tab";
    tab.setAttribute("role", "tab");
    tab.innerHTML = '<span class="dot" style="background:' + verdictColor(d) + ';"></span>' + d.name;
    tab.addEventListener("click", function(){ goTo(i); });
    tabs.appendChild(tab);
  });
  var keep = data.findIndex(function(d){ return d.ticker === keepTicker; });
  currentIdx = keep >= 0 ? keep : 0;
  goTo(currentIdx, true);
}

function goTo(i, instant) {
  var slider = document.getElementById("dashboard");
  if (!slides.length) return;
  i = Math.max(0, Math.min(slides.length - 1, i));
  var card = slider.children[i];
  slider.scrollTo({ left: card.offsetLeft - slider.firstElementChild.offsetLeft, behavior: instant ? "auto" : "smooth" });
  setActive(i);
}

function setActive(i) {
  currentIdx = i;
  var tabs = document.getElementById("marketTabs").children;
  for (var t = 0; t < tabs.length; t++) tabs[t].setAttribute("aria-selected", t === i ? "true" : "false");
  var strip = document.getElementById("marketTabs"), tab = tabs[i];
  if (tab) strip.scrollTo({ left: tab.offsetLeft - strip.offsetLeft - (strip.clientWidth - tab.offsetWidth) / 2 });
  document.getElementById("slideCount").textContent = (i + 1) + " / " + slides.length + " · swipe";
  document.getElementById("btnPrev").disabled = i === 0;
  document.getElementById("btnNext").disabled = i === slides.length - 1;
}

(function initSlider() {
  var slider = document.getElementById("dashboard"), raf = 0;
  slider.addEventListener("scroll", function() {
    cancelAnimationFrame(raf);
    raf = requestAnimationFrame(function() {
      if (!slides.length) return;
      var step = slider.firstElementChild.offsetWidth + 16;
      var i = Math.max(0, Math.min(slides.length - 1, Math.round(slider.scrollLeft / step)));
      if (i !== currentIdx) setActive(i);
    });
  });
  document.getElementById("btnPrev").addEventListener("click", function(){ goTo(currentIdx - 1); });
  document.getElementById("btnNext").addEventListener("click", function(){ goTo(currentIdx + 1); });
  document.addEventListener("keydown", function(e) {
    if (e.key === "ArrowRight") goTo(currentIdx + 1);
    else if (e.key === "ArrowLeft") goTo(currentIdx - 1);
  });
  window.addEventListener("resize", function(){ goTo(currentIdx, true); });
})();

async function buildMarket(m) {
  var snap = SNAPSHOT.markets[m.ticker];
  var res = await Promise.allSettled([fetchCOT(m.cftcCode, m.type), fetchPrice(m.ticker)]);
  var cotLive = res[0].status === "fulfilled" && res[0].value.length >= 5 ? res[0].value : null;
  var priceLive = res[1].status === "fulfilled" && res[1].value.length >= 10 ? res[1].value : null;
  var cot = cotLive || (snap && snap.cot);
  var price = priceLive || (snap && snap.price);
  if (!cot || cot.length < 2 || !price || price.length < 2) return null;
  var source = cotLive && priceLive ? "live" : (cotLive || priceLive ? "partial" : "snapshot");
  var pd = premiumDiscount(price);
  var s = scoreMarket(cot, pd);
  return Object.assign({ name: m.name, ticker: m.ticker, icon: m.icon, iconBg: m.iconBg, decimals: m.decimals, type: m.type, source: source,
    price: pd.price, pos: pd.pos, zone: pd.zone, lo: pd.lo, hi: pd.hi }, s);
}

var loading = false;
async function loadData() {
  if (loading) return;
  loading = true;
  var btn = document.getElementById("btnRefresh");
  btn.disabled = true;
  setStatus("loading", "Fetching live data…");
  showNotice("");
  var settled = await Promise.allSettled(MARKETS.map(buildMarket));
  var results = [], missing = [];
  settled.forEach(function(r, i) {
    if (r.status === "fulfilled" && r.value) results.push(r.value); else missing.push(MARKETS[i].name);
  });
  var live = results.filter(function(d){ return d.source === "live"; }).length;
  var anyLive = results.some(function(d){ return d.source !== "snapshot"; });

  if (results.length === 0) {
    setStatus("offline", "No data");
    showNotice("Couldn't reach CFTC or Yahoo Finance and no saved snapshot is available. Check your internet connection and tap Refresh.");
  } else {
    if (live === results.length) setStatus("live", "Live · " + live + "/" + MARKETS.length);
    else if (anyLive) setStatus("live", "Live " + live + " · snapshot " + (results.length - live));
    else setStatus("snapshot", "Snapshot · " + SNAPSHOT.fetchedAt);
    var msgs = [];
    if (!anyLive) msgs.push("Live feeds can't be reached from this viewer, so the cards show real CFTC and Yahoo data saved on " + SNAPSHOT.fetchedAt + ". Open the Android app for live updates.");
    else if (live < results.length) msgs.push("Some feeds didn't respond; cards marked Snapshot use data saved on " + SNAPSHOT.fetchedAt + ".");
    if (missing.length) msgs.push("No data for: " + missing.join(", ") + ".");
    showNotice(msgs.join(" "), missing.length ? "error" : "info");
    results.sort(function(a, b){ return b.score - a.score; });
    renderAll(results);
  }
  btn.disabled = false;
  loading = false;
}

document.getElementById("timestamp").textContent = new Date().toLocaleDateString(undefined, {
  weekday: "short", year: "numeric", month: "short", day: "numeric", hour: "2-digit", minute: "2-digit"
});
loadData();
</script>
