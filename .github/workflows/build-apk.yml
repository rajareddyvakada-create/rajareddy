name: Build Android APK

on:
  push:
    branches:
      - '*'
    paths:
      - 'SpamCallBlocker/**'
      - '.github/workflows/build-apk.yml'
  pull_request:
    paths:
      - 'SpamCallBlocker/**'
  workflow_dispatch:

jobs:
  build:
    name: Build Signed Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'

      - name: Generate signing keystore
        working-directory: SpamCallBlocker
        run: |
          keytool -genkeypair \
            -alias spamblocker \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -keystore keystore.jks \
            -storepass spamblocker2024 \
            -keypass spamblocker2024 \
            -dname "CN=SpamCallBlocker, OU=Dev, O=SpamBlocker, L=Hyderabad, ST=Telangana, C=IN"

      - name: Build Release APK
        working-directory: SpamCallBlocker
        env:
          KEYSTORE_PASSWORD: spamblocker2024
          KEY_ALIAS: spamblocker
          KEY_PASSWORD: spamblocker2024
        run: gradle assembleRelease --no-daemon

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: SpamCallBlocker-release-apk
          path: SpamCallBlocker/app/build/outputs/apk/release/app-release.apk
          retention-days: 90
