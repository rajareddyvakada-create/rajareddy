name: Build Android APK

on:
  push:
    branches:
      - '*'
    paths:
      - 'SpamCallBlocker/**'
  pull_request:
    paths:
      - 'SpamCallBlocker/**'
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('SpamCallBlocker/**/*.gradle*', 'SpamCallBlocker/**/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: Grant execute permission for gradlew
        run: |
          cd SpamCallBlocker
          gradle wrapper --gradle-version 8.2
          chmod +x gradlew

      - name: Build Debug APK
        run: |
          cd SpamCallBlocker
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SpamCallBlocker-debug
          path: SpamCallBlocker/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
