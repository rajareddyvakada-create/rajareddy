name: Build Android APK

on:
  push:
    branches:
      - '*'
    paths:
      - 'SpamCallBlocker/**'
      - '.github/workflows/build-apk.yml'
  pull_request:
    paths:
      - 'SpamCallBlocker/**'
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('SpamCallBlocker/**/*.gradle*', 'SpamCallBlocker/**/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: Generate Gradle wrapper
        working-directory: SpamCallBlocker
        run: gradle wrapper --gradle-version 8.2

      - name: Build Debug APK
        working-directory: SpamCallBlocker
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SpamCallBlocker-debug-apk
          path: SpamCallBlocker/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 90
